
<link rel="stylesheet" href="../../styles/main.css">
<link rel="stylesheet" href="../../styles/businessSeller.css">

<section id="businessCalculator" class="calculator-card">

    <div class="section-heading">
        <div>
            <span class="step-label">STEP 01</span>
            <h2>Enter business selling details</h2>
            <p>Enter your business seller pricing information below.</p>
        </div>
        <span class="calculator-icon">🏪</span>
    </div>

    <form id="businessCalculatorForm">

        <div class="form-group">
            <label for="businessShop">Shop subscription</label>
            <select id="businessShop" required>
                <option value="none">No Shop</option>
                <option value="basic">Basic</option>
                <option value="featured">Featured</option>
                <option value="anchor">Anchor</option>
            </select>
            <small>Select your eBay Shop subscription.</small>
        </div>

        <div class="form-group">
            <label for="businessVat">VAT registration</label>
            <select id="businessVat" required>
                <option value="registered">VAT Registered</option>
                <option value="not-registered">Not VAT Registered</option>
            </select>
        </div>
        

        <div class="form-group">
            <label for="businessPurchaseVat">Purchase VAT treatment</label>
            <select id="businessPurchaseVat" required>
                <option value="reclaimable">VAT charged and reclaimable</option>
                <option value="non-reclaimable">VAT charged but not reclaimable</option>
                <option value="no-vat">No VAT charged</option>
            </select>
            <small>Select how VAT on your product purchase is treated.</small>
        </div>


        <div class="form-group">
            <label for="businessCategory">Shop category</label>
            
            <select id="businessCategory" required>
                <option value="">Select a category</option>
                <option value="antiques">Antiques</option>
                <option value="art">Art</option>
                <option value="baby">Baby</option>
                <option value="books">Books, Comics & Magazines</option>
                <option value="business">Business, Office & Industrial</option>
                <option value="cameras">Cameras & Photography</option>
                <option value="clothes">Clothes, Shoes & Accessories</option>
                <option value="crafts">Crafts</option>
                <option value="dolls">Dolls & Bears</option>
                <option value="eventTickets">Event Tickets</option>
                <option value="films">Films & TV</option>
                <option value="garden">Garden & Patio</option>
                <option value="health">Health & Beauty</option>
                <option value="holidays">Holidays & Travel</option>
                <option value="home">Home, Furniture & DIY</option>
                <option value="jewellery">Jewellery & Watches</option>
                <option value="mobile">Mobile Phones & Communication</option>
                <option value="music">Music</option>
                <option value="instruments">Musical Instruments & DJ Equipment</option>
                <option value="pets">Pet Supplies</option>
                <option value="pottery">Pottery, Ceramics & Glass</option>
                <option value="sport">Sporting Goods</option>
                <option value="sportsMemorabilia">Sports Memorabilia</option>
                <option value="stamps">Stamps</option>
                <option value="toys">Toys & Games</option>
                <option value="vehicles">Vehicle Parts & Accessories</option>
                <option value="games">Video Games & Consoles</option>
                <option value="wholesale">Wholesale & Job Lots</option>
                <option value="other">Everything Else</option>
            </select>
            <small>Select the category that best matches your product.</small>
        </div>

        <div class="form-group">
            <label for="businessSellingPrice">
                Product selling price <span>£</span>
            </label>
            <input type="number" id="businessSellingPrice"
                   placeholder="e.g. 25.00" min="0.01"
                   step="0.01" required>
        </div>

        <div class="form-group">
            <label for="businessPostage">
                Postage charged to buyer <span>£</span>
            </label>
            <input type="number" id="businessPostage"
                   placeholder="e.g. 3.00" min="0"
                   step="0.01" value="0" required>
        </div>

        <div class="form-group">
            <label for="businessSourcePrice">
                Source / purchase price <span>£</span>
            </label>
            <input type="number" id="businessSourcePrice"
                   placeholder="e.g. 12.00" min="0"
                   step="0.01" required>
        </div>

        <div class="form-group">
            <label for="businessAdRate">
                Advertising rate <span>%</span>
            </label>
            <input type="number" id="businessAdRate"
                   placeholder="e.g. 5" min="0"
                   step="0.01" value="0" required>
        </div>

        <div class="button-group">
            <button type="submit" class="calculate-btn">
                Calculate my profit <span>→</span>
            </button>
            <button type="reset" class="reset-btn">
                Clear
            </button>
        </div>

    </form>
</section>
