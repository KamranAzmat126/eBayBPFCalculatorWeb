<link rel="stylesheet" href="../../styles/main.css">
<link rel="stylesheet" href="../../styles/selection.css">

<section class="seller-section">

  <section class="intro">
    <span class="eyebrow">SELL SMARTER</span>
    <h1>Calculate your profit.</h1>
    <p>Know exactly what you earn before listing your item.</p>
  </section>

  <h3>Choose your seller account</h3>
  
  <div class="seller-options">

    <button class="seller-card active" id="privateTab"
            onclick="selectSeller('private')">
      <span class="seller-icon">👤</span>
      <strong>Private Seller</strong>
      <small>Calculate BPF and selling profit</small>
    </button>

    <button class="seller-card" id="businessTab"
            onclick="selectSeller('business')">
      <span class="seller-icon">🏪</span>
      <strong>Business Seller</strong>
      <small>Business fees and profitability</small>
    </button>

  </div>
</section>
